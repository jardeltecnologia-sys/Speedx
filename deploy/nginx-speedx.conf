# =============================================================================
# SPEEDX - NGINX (VPS)  ->  /etc/nginx/sites-available/speedx
# =============================================================================
# O Nginx é a "portaria" da VPS: recebe o tráfego do mundo (porta 80/443)
# e repassa para o backend do Speedx (127.0.0.1:3010).
# O certbot adiciona o bloco HTTPS automaticamente depois.
# Ativar:  ln -s /etc/nginx/sites-available/speedx /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name speedx.titanhost.cloud;

    # Uploads (documentos KYC no futuro)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # ESSENCIAL para o Socket.io: sem estes 2 cabeçalhos o WebSocket
        # não "sobe" e o tempo real morre silenciosamente
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Identidade real do visitante chega ao backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conexões de tempo real ficam abertas por muito tempo
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
